apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthnivaran-broken-image
  namespace: healthnivaran
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthnivaran-broken-image
  template:
    metadata:
      labels:
        app: healthnivaran-broken-image
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/healthnivaran-backend:this-tag-does-not-exist
          ports:
            - containerPort: 8000
