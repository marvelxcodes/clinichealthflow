apiVersion: v1
kind: Secret
metadata:
  name: healthnivaran-postgres
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: healthnivaran-postgres
spec:
  type: ClusterIP
  selector:
    app: healthnivaran-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthnivaran-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthnivaran-postgres
  template:
    metadata:
      labels:
        app: healthnivaran-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.database }}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: healthnivaran-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthnivaran-postgres
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        # emptyDir for classroom demo (avoids requiring EBS CSI on fresh EKS).
        # Production should use a StorageClass-backed PVC or Amazon RDS.
        - name: data
          emptyDir: {}
