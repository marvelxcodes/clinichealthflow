frontend:
  image: ghcr.io/kushals256/healthnivaran-frontend
  tag: latest
backend:
  image: ghcr.io/kushals256/healthnivaran-backend
  tag: latest
replicaCount: 2
namespace: healthnivaran
imagePullSecrets: []
postgres:
  host: healthnivaran-postgres
  database: healthnivaran
  username: healthnivaran
  password: healthnivaran
ingress:
  enabled: false
  host: healthnivaran.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
monitoring:
  serviceMonitor:
    enabled: true
