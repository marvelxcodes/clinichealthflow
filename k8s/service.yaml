apiVersion: v1
kind: Service
metadata:
  name: healthnivaran-backend
  namespace: healthnivaran
spec:
  selector:
    app: healthnivaran-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: healthnivaran-frontend
  namespace: healthnivaran
spec:
  selector:
    app: healthnivaran-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
