apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthnivaran-backend
  namespace: healthnivaran
  labels:
    app: healthnivaran-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthnivaran-backend
  template:
    metadata:
      labels:
        app: healthnivaran-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/kushals256/healthnivaran-backend:__IMAGE_TAG__
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite:///./healthnivaran.db"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthnivaran-frontend
  namespace: healthnivaran
  labels:
    app: healthnivaran-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthnivaran-frontend
  template:
    metadata:
      labels:
        app: healthnivaran-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/kushals256/healthnivaran-frontend:__IMAGE_TAG__
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
